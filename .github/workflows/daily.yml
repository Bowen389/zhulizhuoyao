name: Zhuoyao Top3
on:
  push:
    branches: [main]
    paths: [.github/workflows/daily.yml]
  schedule:
    - cron: '12 9 * * 1-5'
    - cron: '32 9 * * 1-5'
    - cron: '36 1 * * 1-5'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Candidate scan stage'
        type: choice
        options: [close, open]
        default: close
permissions:
  contents: write
concurrency:
  group: zhuoyao-top3-main
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan and publish
        env:
          EVENT_NAME: ${{ github.event_name }}
          STAGE: ${{ inputs.stage || (github.event.schedule == '36 1 * * 1-5' && 'open' || 'close') }}
        run: |
          set -euo pipefail
          day=$(TZ=Asia/Shanghai date +%F)
          if [ "$EVENT_NAME" != workflow_dispatch ] && [ -s "reports/$day-$STAGE.json" ]; then
            echo "Already published $day $STAGE" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python scan.py "$STAGE" | tee -a "$GITHUB_STEP_SUMMARY"
          git add -- reports/ 2>/dev/null || test ! -d reports
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish Zhuoyao $STAGE candidates"
          git pull --rebase origin main
          git push origin HEAD:main
